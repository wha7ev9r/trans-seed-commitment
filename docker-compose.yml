# ============================================================
# trans-commitment: 在 VPS 上做种 Ubuntu 镜像，回馈社区
#  - 内嵌 Transmission + Flood for Transmission UI
#  - 自带月度流量配额守护（quota-guard），超限自动暂停
#  - vnstat 兜底监控 VPS 整体流量
#  - 一个面板（quota-guard:9092）整合：状态栏 + 种子管理
# ============================================================
services:
  # ---------------- Transmission ----------------
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: trans-commitment-transmission
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
      - TRANSMISSION_WEB_HOME=/flood-ui
    volumes:
      - ./transmission/config:/config
      - ./downloads:/downloads
      - ./watch:/watch
      - ./flood-ui:/flood-ui
    ports:
      # 9091 不直接公网暴露，仅本机，由 quota-guard 反代
      - "127.0.0.1:9091:9091"
      # P2P peer 端口必须公网（tcp + udp），否则无法做种
      - "51413:51413"
      - "51413:51413/udp"
    healthcheck:
      # Transmission RPC returns 409 when the session id is missing; that still
      # proves the daemon and RPC endpoint are alive.
      test:
        [
          "CMD-SHELL",
          'code=$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:9091/transmission/rpc); [ "$code" = 200 ] || [ "$code" = 409 ]',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------- quota-guard ----------------
  # 月度流量配额守护 + 统一控制面板
  # 职责：
  #   1. 每分钟调 Transmission RPC session-stats，累计上传字节
  #   2. 每月 1 号 0 点自动重置累计
  #   3. 累计超配额 -> torrent-stop 暂停所有种子，月初恢复
  #   4. 反代 /torrents/ 和 /transmission/rpc 到 transmission:9091
  #   5. 提供 HTML 控制台（顶部状态栏 + 下方 iframe Flood UI）
  #   6. REST API：/api/status /api/quota /api/pause /api/resume /api/history
  quota-guard:
    build: ./quota-guard
    image: trans-commitment/quota-guard:latest
    container_name: trans-commitment-quota-guard
    restart: unless-stopped
    depends_on:
      transmission:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TRANSMISSION_HOST=transmission
      - TRANSMISSION_PORT=9091
      - TRANSMISSION_USER=${TRANSMISSION_USER}
      - TRANSMISSION_PASS=${TRANSMISSION_PASS}
      - QUOTA_USER=${QUOTA_USER}
      - QUOTA_PASS=${QUOTA_PASS}
      - MONTHLY_QUOTA_BYTES=${MONTHLY_QUOTA_BYTES:-1099511627776}
      - VNSTAT_HOST=${VNSTAT_HOST:-host.docker.internal}
      - VNSTAT_PORT=8685
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./quota-guard/state:/data
    ports:
      # 唯一对外入口，仅本地绑定，OpenResty 反代这个端口
      - "127.0.0.1:${QUOTA_GUARD_PORT:-9092}:9092"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9092/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------- vnstat（VPS 流量兜底监控） ----------------
  # 用途：监控 VPS 网卡总流量（不限于 Transmission）
  # quota-guard 看板会同时展示 vnstat 数据，防止 VPS 因其他流量超额
  # 用 --network=host 才能读到宿主机网卡数据
  vnstat:
    image: vergoh/vnstat:latest
    container_name: trans-commitment-vnstat
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - HTTP_PORT=8685
      - EXTERNAL_INTERFACE=${VNSTAT_INTERFACE:-eth0}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./vnstat:/var/lib/vnstat
    # vnstat 不直接对外，只供 quota-guard 拉取数据
    # 默认监听 127.0.0.1:8685

# 网络声明（默认 bridge 即可，P2P 端口走 host 映射）
# transmission 容器需要 P2P 端口公网可达，上面 ports 已映射
